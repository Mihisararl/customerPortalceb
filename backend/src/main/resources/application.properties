spring.application.name=edl-customer-portal
server.port=8080
server.servlet.context-path=/api

# Logging
logging.level.root=INFO
logging.level.com.edl.portal=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security
security.jwt.secret=your-super-secret-key-change-this-in-production-with-at-least-256-bits-of-entropy
security.jwt.expiration=86400000

# External APIs Configuration
external.api.customer.balance.url=http://10.128.1.59:6001
external.api.customer.details.url=http://10.128.1.59:5020
external.api.otp.service.url=http://10.128.1.227:8080/SharedService
external.api.credentials.username=CEBkiosk
external.api.credentials.password=kiosk#$CEB
external.api.otp.system.code=smc

# Timeout settings (milliseconds)
external.api.connect.timeout=10000
external.api.read.timeout=30000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:8095
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600
